quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}

# Real datasource for dev & prod only. The 'test' profile intentionally has NO
# jdbc.url, which makes Quarkus Dev Services start a throwaway Postgres container
# (via Testcontainers) per test run -- isolated test data, full Postgres fidelity.
%dev.quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5434/student_course_management}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5434/student_course_management}

# Pin the Dev Services image to match production so migrations behave identically.
%test.quarkus.datasource.devservices.image-name=postgres:17-alpine
%test.quarkus.http.test-port=0
%test.quarkus.hibernate-orm.log.sql=false

quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration

