services:
  postgres:
    image: postgres:17-alpine
    container_name: scm-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-student_course_management}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-student_course_management}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.dev
    container_name: scm-quarkus-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-student_course_management}
      QUARKUS_HTTP_HOST: 0.0.0.0
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./:/app
      - maven_cache:/root/.m2

volumes:
  postgres_data:
  maven_cache:
